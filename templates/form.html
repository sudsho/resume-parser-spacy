<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume Parser</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #2c3e50; }
    .box { border: 1px dashed #aaa; padding: 30px; border-radius: 6px; }
    button { padding: 8px 16px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #34495e; }
    .hint { color: #777; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Resume Parser</h1>
  <p>Upload a PDF, DOCX, or TXT resume. We'll extract name, email, phone, education, and skills.</p>
  <div class="box">
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="resume" accept=".pdf,.docx,.txt" required>
      <br><br>
      <button type="submit">Parse</button>
    </form>
    <p class="hint">Max file size 5 MB. Files are deleted after parsing.</p>
  </div>
</body>
</html>
